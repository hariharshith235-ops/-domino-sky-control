                      </button>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
        </section>
      );
    }

    function CrewConnectionsView({ sim, onSelectFlight }) {
      const sortedCrews = useMemo(
        () => [...sim.crews].sort((a, b) => b.utilizationPct - a.utilizationPct),
        [sim.crews]
      );

      const sortedConnections = useMemo(
        () =>
          [...sim.connections].sort((a, b) => {
            if (a.isMissed !== b.isMissed) return a.isMissed ? -1 : 1;
            return (a.slackMins ?? -999) - (b.slackMins ?? -999);
          }),
        [sim.connections]
      );

      return (
        <section aria-label="Crew duty limits and passenger transfers" className="grid grid-cols-1 lg:grid-cols-2 gap-4 h-full overflow-auto">
          <div className="bg-[#131316] border border-[#26262F] rounded-lg overflow-hidden flex flex-col">
            <div className="px-4 py-3 bg-[#17171D] border-b border-[#26262F] flex items-center justify-between text-xs">
              <h2 className="font-semibold text-[#F2D6B3] flex items-center gap-2">
                <ShieldAlert className="w-3.5 h-3.5 text-[#E14949]" />
                Crew Legal Duty Ceiling (600m Max)
              </h2>
              <span className="text-[11px] text-[#A8A8B3]">Highest utilization first</span>
            </div>
            <div className="overflow-auto max-h-[540px] p-3.5 space-y-2.5">
              {sortedCrews.map((c) => {
                const ceilingPct = (600 / 720) * 100;
                const legalFillPct = Math.min(ceilingPct, (Math.min(c.dutyMins, 600) / 720) * 100);
                const breachFillPct = c.isBreach ? Math.min(100 - ceilingPct, (c.breachMins / 720) * 100) : 0;

                return (
                  <div
                    key={c.crew_id}
                    className={`p-3 rounded-md border ${
                      c.isBreach
                        ? 'bg-[#221316] border-[#E14949]/70'
                        : c.utilizationPct >= 95
                        ? 'bg-[#1D1813] border-[#C88A5B]/50'
                        : 'bg-[#17171E] border-[#262630]'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <div className="flex items-center gap-2 font-mono text-xs">
                        <span className="font-semibold text-[#F5F5F7]">{c.crew_id}</span>
                        <span className="text-[#B4B4BF]">{c.tail_id}</span>
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#0D0D10] text-[#D4D4D8]">
                          {c.base}
                        </span>
                      </div>
                      <div className="font-mono tabular-nums text-xs font-semibold">
                        {c.isBreach ? (
                          <span className="text-[#FCA5A5]">
                            {c.dutyMins}m <span className="text-[#E14949]">(+{c.breachMins}m)</span>
                          </span>
                        ) : (
                          <span className="text-[#F5F5F7]">
                            {c.dutyMins}m <span className="text-[#A8A8B3] font-normal">/ 600m</span>
                          </span>
                        )}
                      </div>
                    </div>

                    <div
                      className="relative h-2 rounded-full bg-[#0B0B0E] overflow-hidden"
                      role="progressbar"
                      aria-label={`${c.crew_id} duty minutes`}
                      aria-valuenow={c.dutyMins}
                      aria-valuemin={0}
                      aria-valuemax={c.max_duty_mins}
                    >
                      <div
                        className={`absolute top-0 bottom-0 left-0 transition-all duration-300 ${
                          c.isBreach
                            ? 'bg-[#C88A5B]'
                            : c.utilizationPct >= 95
                            ? 'bg-[#E3B987]'
                            : 'bg-[#64748B]'
                        }`}
                        style={{ width: `${legalFillPct}%` }}
                      />
                      {breachFillPct > 0 && (
                        <div
                          className="absolute top-0 bottom-0 bg-[#E14949]"
                          style={{ left: `${ceilingPct}%`, width: `${breachFillPct}%` }}
                        />
                      )}
                      <div
                        className="absolute top-0 bottom-0 w-[2px] bg-[#F2D6B3]"
                        style={{ left: `${ceilingPct}%` }}
                        title="600m Legal Duty Limit"
                      />
                    </div>
                    <div className="flex justify-between text-[10px] font-mono text-[#A8A8B3] mt-1.5">
                      <span>Sign-on {c.duty_start} → Off {toHHMM(c.dutyEnd)}</span>
                      <span>{c.activeFlightCount} legs</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-[#131316] border border-[#26262F] rounded-lg overflow-hidden flex flex-col">
            <div className="px-4 py-3 bg-[#17171D] border-b border-[#26262F] flex items-center justify-between text-xs">
              <h2 className="font-semibold text-[#F2D6B3] flex items-center gap-2">
                <GitMerge className="w-3.5 h-3.5 text-[#E3B987]" />
                Passenger Transfer Windows (21)
              </h2>
              <span className="text-[11px] text-[#A8A8B3]">Missed first</span>
            </div>
            <div className="overflow-auto max-h-[540px] p-3.5 space-y-2.5">
              {sortedConnections.map((cx) => {
                const ratio =
                  cx.status === 'cancelled'
                    ? 0
                    : Math.max(0, Math.min(100, ((cx.connectWindow || 0) / (cx.min_connect_minutes * 2)) * 100));
                return (
                  <div
                    key={cx.connection_id}
                    className={`p-3 rounded-md border ${
                      cx.isMissed
                        ? 'bg-[#221316] border-[#E14949]/70'
                        : 'bg-[#17171E] border-[#262630]'
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <div className="flex items-center gap-2 font-mono text-xs">
                        <span className="font-semibold text-[#F2D6B3]">{cx.connection_id}</span>
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#0D0D10] text-[#E4E4E7]">
                          {cx.airport}
                        </span>
                        <span className="text-[#B4B4BF] text-[11px]">{cx.passengers} pax</span>
                      </div>
                      <span
                        className={`text-[10px] font-mono tabular-nums font-semibold px-2 py-0.5 rounded ${
                          cx.status === 'made'
                            ? 'bg-[#192420] text-[#6EE7B7]'
                            : 'bg-[#E14949]/25 text-[#FCA5A5]'
                        }`}
                      >
                        {cx.status === 'made'
                          ? `Safe +${cx.slackMins}m`
                          : cx.status === 'cancelled'
                          ? 'Cancelled'
                          : `Missed ${cx.slackMins}m`}
                      </span>
                    </div>

                    <div className="flex items-center gap-2.5 font-mono text-[11px]">
                      <button
                        type="button"
                        onClick={() => onSelectFlight(cx.from_flight)}
                        className="px-2 py-1 rounded bg-[#0D0D10] border border-[#32323E] hover:border-[#F2D6B3] text-[#F5F5F7] cursor-pointer shrink-0"
                      >
                        {cx.from_flight}
                      </button>
                      <div className="flex-1 flex flex-col gap-1">
                        <div className="h-1.5 w-full rounded-full bg-[#0B0B0E] relative overflow-hidden">
                          <div
                            className={`h-full rounded-full ${cx.isMissed ? 'bg-[#E14949]' : 'bg-[#34D399]'}`}
                            style={{ width: `${ratio}%` }}
                          />
                          <div className="absolute top-0 bottom-0 left-1/2 w-[1.5px] bg-[#F2D6B3]" />
                        </div>
                        <div className="flex justify-between text-[10px] text-[#A8A8B3]">
                          <span>{cx.status === 'cancelled' ? 'Cancelled' : `Gap: ${cx.connectWindow}m`}</span>
                          <span>Min: {cx.min_connect_minutes}m</span>
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => onSelectFlight(cx.to_flight)}
                        className="px-2 py-1 rounded bg-[#0D0D10] border border-[#32323E] hover:border-[#F2D6B3] text-[#F5F5F7] cursor-pointer shrink-0"
                      >
                        {cx.to_flight}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    // ============================================================================
    // 8. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [simState, setSimState] = useState(EMPTY_STATE);
      const [history, setHistory] = useState([]);
      const [activeView, setActiveView] = useState('gantt');
      const [drawerTab, setDrawerTab] = useState('simulate');
      const [controlTab, setControlTab] = useState('flight');
      const [selectedFlightId, setSelectedFlightId] = useState('DS0301');
      const [hoveredRecoveryId, setHoveredRecoveryId] = useState(null);
      const [showTestsModal, setShowTestsModal] = useState(false);
      const [chainExpanded, setChainExpanded] = useState(false);
      const [liveAnnouncement, setLiveAnnouncement] = useState('');

      const [closureAirport, setClosureAirport] = useState('DEL');
      const [closureStart, setClosureStart] = useState('06:00');
      const [closureEnd, setClosureEnd] = useState('10:00');

      const [aogTail, setAogTail] = useState('VT-DS06');
      const [aogLegOrder, setAogLegOrder] = useState(1);

      // Escape key closes Verify modal
      useEffect(() => {
        if (!showTestsModal) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') setShowTestsModal(false);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [showTestsModal]);

      const pushState = useCallback((nextStateOrFn, announcement) => {
        setSimState((prev) => {
          const next = typeof nextStateOrFn === 'function' ? nextStateOrFn(prev) : nextStateOrFn;
          setHistory((h) => [...h.slice(-24), prev]);
          return next;
        });
        if (announcement) setLiveAnnouncement(announcement);
      }, []);

      const handleUndo = useCallback(() => {
        setHistory((h) => {
          if (h.length === 0) return h;
          const previous = h[h.length - 1];
          setSimState(previous);
          setLiveAnnouncement('Undid last simulation action.');
          return h.slice(0, -1);
        });
      }, []);

      const handleReset = useCallback(() => {
        setHistory([]);
        setSimState(EMPTY_STATE);
        setHoveredRecoveryId(null);
        setDrawerTab('simulate');
        setLiveAnnouncement('Simulation reset to clean baseline schedule.');
      }, []);

      const sim = useMemo(() => runSimulation(FLIGHT_NETWORK, simState), [simState]);

      const recoveryOptions = useMemo(
        () => generateRecoveryOptions(FLIGHT_NETWORK, simState, sim),
        [simState, sim]
      );

      const hoveredOption = useMemo(
        () => recoveryOptions.find((o) => o.id === hoveredRecoveryId) || null,
        [recoveryOptions, hoveredRecoveryId]
      );

      const selectedFlight = sim.flightMap[selectedFlightId] || sim.flights[0];
      const selectedFlightCrew = sim.crews.find((c) => c.tail_id === selectedFlight?.tail_id);
      const testResults = useMemo(() => (showTestsModal ? runEngineSelfTests() : []), [showTestsModal]);
      const passedTestCount = useMemo(
        () => testResults.filter((t) => t.pass).length,
        [testResults]
      );

      const updateFlightDelay = (flightId, mins) => {
        if (!VALID_FLIGHT_IDS.has(flightId)) return;
        const val = clampInt(mins, 0, 360);
        pushState((prev) => {
          const nextDelays = { ...prev.flightDelays };
          if (val === 0) delete nextDelays[flightId];
          else nextDelays[flightId] = val;
          return { ...prev, flightDelays: nextDelays };
        }, `Set ${flightId} departure delay to ${val} minutes.`);
      };

      const toggleCancelFlight = (flightId) => {
        if (!VALID_FLIGHT_IDS.has(flightId)) return;
        pushState((prev) => {
          const exists = prev.cancelledFlights.includes(flightId);
          return {
            ...prev,
            cancelledFlights: exists
              ? prev.cancelledFlights.filter((id) => id !== flightId)
              : [...prev.cancelledFlights, flightId],
          };
        }, `Toggled cancellation for flight ${flightId}.`);
      };

      const applyAog = () => {
        pushState(
          (prev) => ({
            ...prev,
            aogTails: { ...prev.aogTails, [aogTail]: clampInt(aogLegOrder, 1, 10) },
          }),
          `Grounded aircraft ${aogTail} from leg ${aogLegOrder}.`
        );
      };

      const removeAog = (tailId) => {
        pushState((prev) => {
          const next = { ...prev.aogTails };
          delete next[tailId];
          return { ...prev, aogTails: next };
        }, `Restored aircraft ${tailId} to service.`);
      };

      const applyClosure = () => {
        if (!VALID_AIRPORT_IDS.has(closureAirport)) return;
        const s = toMins(closureStart);
        const e = toMins(closureEnd);
        if (e <= s) return;
        pushState(
          (prev) => ({
            ...prev,
            airportClosures: {
              ...prev.airportClosures,
              [closureAirport]: { start: s, end: e },
            },
          }),
          `Closed airport ${closureAirport} from ${closureStart} to ${closureEnd}.`
        );
      };

      const removeClosure = (apId) => {
        pushState((prev) => {
          const next = { ...prev.airportClosures };
          delete next[apId];
          return { ...prev, airportClosures: next };
        }, `Reopened airport ${apId}.`);
      };

      const launchPreset = (preset) => {

                          </div>
                        )}
                      </div>
                    )}

                    {controlTab === 'closure' && (
                      <div className="space-y-3.5">
                        <div>
                          <label htmlFor="closure-airport-select" className="block text-[11px] font-medium text-[#B4B4BF] mb-1.5">
                            Station
                          </label>
                          <select
                            id="closure-airport-select"
                            value={closureAirport}
                            onChange={(e) => setClosureAirport(e.target.value)}
                            className="w-full bg-[#0C0C0F] border border-[#32323E] rounded-md px-3 py-2 text-xs font-mono text-[#F5F5F7]"
                          >
                            {FLIGHT_NETWORK.airports.map((a) => (
                              <option key={a.id} value={a.id}>
                                {a.id} · {a.city}
                              </option>
                            ))}
                          </select>
                        </div>
                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label htmlFor="closure-start" className="block text-[11px] font-medium text-[#B4B4BF] mb-1.5">
                              Start (IST)
                            </label>
                            <input
                              id="closure-start"
                              type="time"
                              value={closureStart}
                              onChange={(e) => setClosureStart(e.target.value)}
                              className="w-full bg-[#0C0C0F] border border-[#32323E] rounded-md px-2.5 py-2 text-xs font-mono text-[#F5F5F7]"
                            />
                          </div>
                          <div>
                            <label htmlFor="closure-end" className="block text-[11px] font-medium text-[#B4B4BF] mb-1.5">
                              Reopen (IST)
                            </label>
                            <input
                              id="closure-end"
                              type="time"
                              value={closureEnd}
                              onChange={(e) => setClosureEnd(e.target.value)}
                              className="w-full bg-[#0C0C0F] border border-[#32323E] rounded-md px-2.5 py-2 text-xs font-mono text-[#F5F5F7]"
                            />
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={applyClosure}
                          className="w-full py-2.5 rounded-md bg-[#1D1813] hover:bg-[#292017] border border-[#E3B987]/60 text-[#F2D6B3] text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer"
                        >
                          <CloudFog className="w-3.5 h-3.5" /> Close {closureAirport} ({closureStart}–{closureEnd})
                        </button>

                        {Object.keys(simState.airportClosures).length > 0 && (
                          <div className="space-y-1.5 pt-3 border-t border-[#26262F]">
                            <div className="text-[11px] text-[#A8A8B3]">Active Closures</div>
                            {Object.entries(simState.airportClosures).map(([ap, win]) => (
                              <div
                                key={ap}
                                className="flex items-center justify-between px-3 py-2 rounded-md bg-[#1D1813] border border-[#E3B987]/45 text-xs font-mono"
                              >
                                <span className="text-[#F2D6B3]">
                                  {ap} · {toHHMM(win.start)}–{toHHMM(win.end)}
                                </span>
                                <button
                                  type="button"
                                  aria-label={`Reopen airport ${ap}`}
                                  onClick={() => removeClosure(ap)}
                                  className="text-[#B4B4BF] hover:text-white cursor-pointer"
                                >
                                  <X className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {recoveryOptions.length > 0 && (
                      <button
                        type="button"
                        onClick={() => setDrawerTab('recover')}
                        className="mt-auto w-full py-2.5 px-3 rounded-md bg-[#F2D6B3]/15 hover:bg-[#F2D6B3]/25 border border-[#F2D6B3]/50 text-xs font-semibold text-[#F2D6B3] flex items-center justify-between transition-colors cursor-pointer"
                      >
                        <span className="flex items-center gap-1.5">
                          <Sparkles className="w-3.5 h-3.5" />
                          {recoveryOptions.length} Recovery Options Ready
                        </span>
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                )}

                {drawerTab === 'recover' && (
                  <div
                    id="inspector-panel-recover"
                    role="tabpanel"
                    aria-labelledby="inspector-tab-recover"
                    className="p-4 flex-1 overflow-auto space-y-3"
                  >
                    {recoveryOptions.length === 0 ? (
                      <div className="h-full min-h-[260px] flex flex-col items-center justify-center text-center px-4">
                        <div className="w-10 h-10 rounded-full bg-[#18181F] border border-[#32323E] flex items-center justify-center mb-3">
                          <CheckCircle2 className="w-5 h-5 text-[#F2D6B3]" />
                        </div>
                        <h3 className="text-sm font-semibold text-[#F5F5F7]">
                          {k.flightsDelayed === 0 && k.flightsCancelled === 0
                            ? 'All Operations Nominal'
                            : 'No Further Recoveries'}
                        </h3>
                        <p className="text-xs text-[#A8A8B3] mt-1.5 leading-relaxed">
                          {k.flightsDelayed === 0 && k.flightsCancelled === 0
                            ? 'Select a scenario preset or inject a delay in the Simulate tab to generate ranked recovery actions.'
                            : 'Available spare aircraft and legal connection hold windows have been exhausted.'}
                        </p>
                      </div>
                    ) : (
                      recoveryOptions.map((opt, idx) => {
                        const isSpotlight = idx === 0;
                        const beforeDelay = Math.max(1, k.totalDelayMins);
                        const afterDelay = opt.sim.kpis.totalDelayMins;
                        const afterBarPct = Math.min(100, Math.round((afterDelay / beforeDelay) * 100));

                        return (
                          <article
                            key={opt.id}
                            onMouseEnter={() => setHoveredRecoveryId(opt.id)}
                            onMouseLeave={() => setHoveredRecoveryId(null)}
                            style={isSpotlight ? CHAMFER_CARD : undefined}
                            className={`p-3.5 transition-all ${
                              isSpotlight
                                ? 'bg-[#F5F5F7] text-[#0A0A0B] shadow-[0_12px_28px_rgba(0,0,0,0.55)]'
                                : 'rounded-lg bg-[#17171E] border border-[#2C2C36] hover:border-[#F2D6B3]/60 text-[#F5F5F7]'
                            }`}
                          >
                            <div className="flex items-start justify-between gap-2 mb-2">
                              <div>
                                <span
                                  className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#0A0A0B] text-[#F2D6B3]'
                                      : 'bg-[#262632] text-[#F2D6B3]'
                                  }`}
                                >
                                  #{idx + 1} {isSpotlight ? 'BEST OPTION' : 'ALTERNATIVE'}
                                </span>
                                <h3
                                  className={`text-sm font-bold mt-1.5 ${
                                    isSpotlight ? 'text-[#0A0A0B]' : 'text-[#F5F5F7]'
                                  }`}
                                >
                                  {opt.title}
                                </h3>
                                <p
                                  className={`text-xs mt-0.5 leading-snug ${
                                    isSpotlight ? 'text-[#27272A]' : 'text-[#B4B4BF]'
                                  }`}
                                >
                                  {opt.subtitle}
                                </p>
                              </div>
                            </div>

                            <div
                              className={`p-2 rounded mb-3 ${
                                isSpotlight ? 'bg-[#E4E4EA]' : 'bg-[#101014]'
                              }`}
                            >
                              <div className="flex items-center justify-between text-[11px] font-mono tabular-nums mb-1">
                                <span className={isSpotlight ? 'text-[#27272A]' : 'text-[#B4B4BF]'}>
                                  Delay
                                </span>
                                <span className="font-semibold">
                                  {k.totalDelayMins}m → {afterDelay}m
                                </span>
                              </div>
                              <div
                                className={`h-1.5 w-full rounded-full overflow-hidden ${
                                  isSpotlight ? 'bg-[#C8C8D2]' : 'bg-[#262630]'
                                }`}
                              >
                                <div
                                  className={`h-full rounded-full transition-all duration-300 ${
                                    afterDelay < k.totalDelayMins
                                      ? isSpotlight
                                        ? 'bg-[#0A0A0B]'
                                        : 'bg-[#34D399]'
                                      : 'bg-[#C88A5B]'
                                  }`}
                                  style={{ width: `${Math.max(4, afterBarPct)}%` }}
                                />
                              </div>
                            </div>

                            <div className="flex flex-wrap gap-1.5 mb-3 text-[10px] font-mono tabular-nums font-semibold">
                              {opt.deltas.crewBreaches < 0 && (
                                <span
                                  className={`px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#E14949]/15 text-[#7F1D1D]'
                                      : 'bg-[#E14949]/25 text-[#FCA5A5]'
                                  }`}
                                >
                                  Breaches {opt.deltas.crewBreaches}
                                </span>
                              )}
                              {opt.deltas.flightsCancelled < 0 && (
                                <span
                                  className={`px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#4E80EE]/15 text-[#1E3A8A]'
                                      : 'bg-[#4E80EE]/25 text-[#BFDBFE]'
                                  }`}
                                >
                                  Restores {Math.abs(opt.deltas.flightsCancelled)} Legs
                                </span>
                              )}
                              {opt.deltas.strandedPax < 0 && (
                                <span
                                  className={`px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#0A0A0B] text-[#F2D6B3]'
                                      : 'bg-[#F2D6B3]/20 text-[#F2D6B3]'
                                  }`}
                                >
                                  Rescues {Math.abs(opt.deltas.strandedPax)} Pax
                                </span>
                              )}
                              {opt.deltas.totalDelayMins < 0 && (
                                <span
                                  className={`px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#0A0A0B]/10 text-[#0A0A0B]'
                                      : 'bg-[#2A2A34] text-[#F5F5F7]'
                                  }`}
                                >
                                  {opt.deltas.totalDelayMins}m delay
                                </span>
                              )}
                              {opt.deltas.totalDelayMins > 0 && (
                                <span
                                  className={`px-1.5 py-0.5 rounded-sm ${
                                    isSpotlight
                                      ? 'bg-[#C88A5B]/25 text-[#431407]'
                                      : 'bg-[#C88A5B]/25 text-[#F2D6B3]'
                                  }`}
                                >
                                  +{opt.deltas.totalDelayMins}m hold
                                </span>
                              )}
                            </div>

                            <button
                              type="button"
                              onClick={() => applyRecovery(opt)}
                              className={`w-full py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                                isSpotlight
                                  ? 'bg-[#0A0A0B] hover:bg-[#1E1E24] text-[#F2D6B3]'
                                  : 'bg-[#F2D6B3] hover:bg-[#E3B987] text-[#0A0A0B]'
                              }`}
                            >
                              <Zap className="w-3.5 h-3.5" /> Apply Recovery
                            </button>
                          </article>
                        );
                      })
                    )}
                  </div>
                )}
              </aside>
            </div>
          </main>

          {/* ACCESSIBLE VERIFICATION MODAL */}
          {showTestsModal && (
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby="verify-modal-title"
              className="fixed inset-0 z-50 bg-[#0A0A0B]/85 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div className="bg-[#131316] border border-[#32323E] rounded-xl max-w-2xl w-full max-h-[88vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="px-5 py-3.5 bg-[#17171D] border-b border-[#26262F] flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <FlaskConical className="w-4 h-4 text-[#F2D6B3]" />
                    <h2 id="verify-modal-title" className="text-xs font-bold uppercase tracking-[0.14em] text-[#F2D6B3]">
                      Cascade Engine Verification Suite ({passedTestCount}/{testResults.length} Passed)
                    </h2>
                  </div>
                  <button
                    type="button"
                    aria-label="Close verification suite modal"
                    onClick={() => setShowTestsModal(false)}
                    className="text-[#B4B4BF] hover:text-white p-1 rounded cursor-pointer"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="p-5 space-y-2.5 overflow-auto">
                  {testResults.map((t, i) => (
                    <div
                      key={i}
                      className={`p-3 rounded-lg border ${
                        t.pass
                          ? 'bg-[#17171E] border-[#2A2A34]'
                          : 'bg-[#1B1214] border-[#E14949]/70'
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-xs font-semibold text-[#F5F5F7]">{t.name}</span>
                        <span
                          className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-sm shrink-0 ${
                            t.pass ? 'bg-[#F2D6B3] text-[#0A0A0B]' : 'bg-[#E14949] text-white'
                          }`}
                        >
                          {t.pass ? 'PASS' : 'FAIL'}
                        </span>
                      </div>
                      <div className="text-[11px] font-mono tabular-nums text-[#B4B4BF] mt-1">
                        {t.detail}
                      </div>
                    </div>
                  ))}
                  <div className="pt-2 flex items-center justify-between text-xs text-[#B4B4BF]">
                    <span className="flex items-center gap-1.5 text-[11px]">
                      <Info className="w-3.5 h-3.5 text-[#E3B987]" />
                      10 deterministic hand-calculated assertions (Press Esc to close)
                    </span>
                    <button
                      type="button"
                      onClick={() => setShowTestsModal(false)}
                      className="px-4 py-1.5 rounded-md bg-[#F2D6B3] hover:bg-[#E3B987] text-[#0A0A0B] font-semibold text-xs cursor-pointer"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
