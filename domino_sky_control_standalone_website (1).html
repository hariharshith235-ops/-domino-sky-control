    // ============================================================================
    // 2. VALIDATION, TIME UTILITIES, DESIGN TOKENS & DEFAULT STATE
    // ============================================================================
    const MIN_TURNAROUND = FLIGHT_NETWORK.meta.min_turnaround_minutes;
    const VALID_AIRPORT_IDS = new Set(FLIGHT_NETWORK.airports.map((a) => a.id));
    const VALID_FLIGHT_IDS = new Set(FLIGHT_NETWORK.flights.map((f) => f.flight_id));

    /**
     * Clamps a finite numeric value between min and max.
     * @param {number|string} val - Input value.
     * @param {number} min - Minimum bound.
     * @param {number} max - Maximum bound.
     * @returns {number} Clamped integer.
     */
    function clampInt(val, min, max) {
      const n = Number(val);
      if (!Number.isFinite(n)) return min;
      return Math.max(min, Math.min(max, Math.round(n)));
    }

    /**
     * Converts 24-hour "HH:MM" string to minutes since midnight.
     * @param {string} hhmm - Time string in HH:MM format.
     * @returns {number} Minutes since 00:00.
     */
    function toMins(hhmm) {
      const parts = String(hhmm || '00:00').split(':').map(Number);
      const h = clampInt(parts[0] || 0, 0, 29);
      const m = clampInt(parts[1] || 0, 0, 59);
      return h * 60 + m;
    }

    /**
     * Formats minutes since midnight into "HH:MM".
     * @param {number} totalMins - Minutes since 00:00.
     * @returns {string} Formatted HH:MM time string.
     */
    function toHHMM(totalMins) {
      const safe = Math.max(0, Math.round(Number(totalMins) || 0));
      const h = Math.floor(safe / 60);
      const m = safe % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    /**
     * Formats a duration in minutes as "Xh Ym" or "Ym".
     * @param {number} mins - Duration in minutes.
     * @returns {string} Human-readable duration.
     */
    function formatDuration(mins) {
      const safe = Math.max(0, Math.round(Number(mins) || 0));
      if (safe === 0) return '0m';
      const h = Math.floor(safe / 60);
      const m = safe % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    const EMPTY_STATE = Object.freeze({

    // ============================================================================
    // 3. PURE CASCADE SIMULATION ENGINE
    // ============================================================================
    /**
     * Validates whether a spare aircraft can legally take over a specific flight leg.
     * @param {Object} spare - Spare aircraft object from dataset.
     * @param {Object} leg - Flight leg object.
     * @returns {boolean} True if spare is positioned at leg origin and available by scheduled departure.
     */
    function isSpareEligibleForLeg(spare, leg) {
      if (!spare || !leg) return false;
      return spare.base === leg.origin && toMins(leg.dep) >= toMins(spare.available_from);
    }

    /**
     * Runs the deterministic single-day airline disruption cascade simulation.
     * Pure function: never mutates `dataset` or `state`.
     * @param {Object} dataset - Frozen flight network dataset.
     * @param {Object} state - Disruption and recovery state.
     * @returns {Object} Simulated flights, crews, connections, airports, and aggregate KPIs.
     */
    function runSimulation(dataset, state) {
      const safeState = state || EMPTY_STATE;
      const rawDelays = safeState.flightDelays || {};
      const cancelledSet = new Set(
        (safeState.cancelledFlights || []).filter((id) => VALID_FLIGHT_IDS.has(id))
      );
      const aogTails = safeState.aogTails || {};
      const closures = safeState.airportClosures || {};
      const spareAssignments = safeState.spareAssignments || [];
      const rawRetimes = safeState.retimes || {};

      const spareByTarget = {};
      spareAssignments.forEach((sa) => {
        if (!spareByTarget[sa.targetTail] || sa.fromLegOrder < spareByTarget[sa.targetTail].fromLegOrder) {
          spareByTarget[sa.targetTail] = sa;
        }
      });

      const byTail = {};
      dataset.flights.forEach((f) => {
        if (!byTail[f.tail_id]) byTail[f.tail_id] = [];
        byTail[f.tail_id].push(f);
      });
      Object.values(byTail).forEach((legs) => legs.sort((a, b) => a.leg_order - b.leg_order));

      const simulatedFlights = [];
      const flightMap = {};

      Object.entries(byTail).forEach(([tailId, legs]) => {
        const aogFrom = aogTails[tailId];
        const spare = spareByTarget[tailId];
        let prevOriginalArr = null;
        let prevSpareArr = null;

        legs.forEach((f) => {
          const schedDep = toMins(f.dep);
          const schedArr = toMins(f.arr);
          const isSpareOperated = Boolean(spare && f.leg_order >= spare.fromLegOrder);
          const effectiveTail = isSpareOperated ? spare.spareId : tailId;

          const isAogCancelled = !isSpareOperated && aogFrom != null && f.leg_order >= aogFrom;
          const isCancelled = cancelledSet.has(f.flight_id) || isAogCancelled;

          if (isCancelled) {
            const res = {
              ...f,
              schedDep,
              schedArr,
              actualDep: schedDep,
              actualArr: schedArr,
              delay: 0,
              status: 'cancelled',
              effectiveTail,
              isSpareOperated,
              isCrewBreach: false,
              closureHold: false,
            };
            simulatedFlights.push(res);
            flightMap[f.flight_id] = res;
            return;
          }

          const manualDelay = isSpareOperated
            ? 0
            : clampInt(rawDelays[f.flight_id] || 0, 0, 360);
          const retimeHold = clampInt(rawRetimes[f.flight_id] || 0, -120, 360);
          const prevArr = isSpareOperated ? prevSpareArr : prevOriginalArr;

          let actualDep = Math.max(
            schedDep + manualDelay + retimeHold,
            prevArr !== null ? prevArr + MIN_TURNAROUND : 0
          );
          let closureHold = false;

          const origClosure = VALID_AIRPORT_IDS.has(f.origin) ? closures[f.origin] : null;
          if (origClosure && actualDep >= origClosure.start && actualDep < origClosure.end) {
            actualDep = origClosure.end;
            closureHold = true;
          }

          let actualArr = actualDep + f.block_minutes;
          const destClosure = VALID_AIRPORT_IDS.has(f.destination) ? closures[f.destination] : null;
          if (destClosure && actualArr > destClosure.start && actualArr < destClosure.end) {
            actualDep = destClosure.end - f.block_minutes;
            actualArr = destClosure.end;
            closureHold = true;
            if (origClosure && actualDep >= origClosure.start && actualDep < origClosure.end) {
              actualDep = origClosure.end;
              actualArr = actualDep + f.block_minutes;
            }
          }

          const delay = Math.max(0, actualDep - schedDep);
          if (isSpareOperated) prevSpareArr = actualArr;
          else prevOriginalArr = actualArr;

          const res = {
            ...f,
            schedDep,
            schedArr,
            actualDep,
            actualArr,
            delay,
            status: delay > 0 ? 'delayed' : 'on_time',
            effectiveTail,
            isSpareOperated,
            isCrewBreach: false,
            closureHold,
          };
          simulatedFlights.push(res);
          flightMap[f.flight_id] = res;
        });
      });

      const crews = dataset.crews.map((c) => {
        const dutyStart = toMins(c.duty_start);
        const activeLegs = c.flight_ids
          .map((id) => flightMap[id])
          .filter((f) => f && f.status !== 'cancelled' && !f.isSpareOperated);

        const lastLeg = activeLegs[activeLegs.length - 1] || null;
        const dutyEnd = lastLeg ? lastLeg.actualArr : dutyStart;
        const dutyMins = lastLeg ? Math.max(0, dutyEnd - dutyStart) : 0;
        const breachMins = Math.max(0, dutyMins - c.max_duty_mins);
        const isBreach = breachMins > 0;
        const headroomMins = Math.max(0, c.max_duty_mins - dutyMins);
        const utilizationPct = Math.round((dutyMins / c.max_duty_mins) * 100);

        if (isBreach) {
          activeLegs.forEach((leg) => {
            if (leg.actualArr - dutyStart > c.max_duty_mins) {
              leg.isCrewBreach = true;
            }
          });
        }

        return {
          ...c,
          dutyStart,
          dutyEnd,
          dutyMins,
          breachMins,
          isBreach,
          headroomMins,
          utilizationPct,
          activeFlightCount: activeLegs.length,
        };
      });

      const connections = dataset.connections.map((cx) => {
        const fromF = flightMap[cx.from_flight];
        const toF = flightMap[cx.to_flight];
        if (!fromF || !toF || fromF.status === 'cancelled' || toF.status === 'cancelled') {
          return {
            ...cx,
            status: 'cancelled',
            isMissed: true,
            connectWindow: null,
            slackMins: null,
          };
        }
        const connectWindow = toF.actualDep - fromF.actualArr;
        const slackMins = connectWindow - cx.min_connect_minutes;
        const isMissed = connectWindow < cx.min_connect_minutes;
        return {
          ...cx,
          status: isMissed ? 'missed' : 'made',
          isMissed,
          connectWindow,
          slackMins,
        };
      });

      const airports = dataset.airports.map((ap) => {
        const hourly = {};
        for (let h = 5; h <= 23; h++) hourly[h] = 0;

        simulatedFlights.forEach((f) => {
          if (f.status === 'cancelled') return;
          if (f.origin === ap.id) {
            const h = Math.min(23, Math.max(5, Math.floor(f.actualDep / 60)));
            hourly[h] = (hourly[h] || 0) + 1;
          }
          if (f.destination === ap.id) {
            const h = Math.min(23, Math.max(5, Math.floor(f.actualArr / 60)));
            hourly[h] = (hourly[h] || 0) + 1;
          }
        });

        const peakMovements = Math.max(0, ...Object.values(hourly));
        const overloadedHours = Object.entries(hourly)
          .filter(([, cnt]) => cnt > ap.capacity_per_hour)
          .map(([h]) => Number(h));

        return {
          ...ap,
          hourly,
          peakMovements,
          overloadedHours,
          isOverloaded: overloadedHours.length > 0,
          closure: closures[ap.id] || null,
        };
      });

      const flightsDelayed = simulatedFlights.filter((f) => f.status === 'delayed').length;
      const flightsCancelled = simulatedFlights.filter((f) => f.status === 'cancelled').length;
      const totalDelayMins = simulatedFlights.reduce(
        (acc, f) => acc + (f.status === 'delayed' ? f.delay : 0),
        0
      );
      const passengersAffected = simulatedFlights.reduce(
        (acc, f) => acc + (f.status === 'delayed' || f.status === 'cancelled' ? f.pax : 0),
        0
      );
      const missedConnections = connections.filter((c) => c.isMissed).length;
      const strandedPax = connections.reduce((acc, c) => acc + (c.isMissed ? c.passengers : 0), 0);
      const crewBreaches = crews.filter((c) => c.isBreach).length;
      const maxCrewOverage = Math.max(0, ...crews.map((c) => c.breachMins));
      const airportOverloads = airports.filter((a) => a.isOverloaded).length;

      return {
        flights: simulatedFlights,
        flightMap,
        crews,
        connections,
        airports,
        kpis: {
          flightsDelayed,
          flightsCancelled,
          totalDelayMins,
          passengersAffected,
          missedConnections,
          strandedPax,
          crewBreaches,
          maxCrewOverage,
          airportOverloads,
        },
      };
    }

    // ============================================================================
    // 4. RECOVERY ENGINE (RULE-VALIDATED & RANKED)
    // ============================================================================
    /**
     * Computes a weighted operational penalty score (lower is better).
     * @param {Object} k - KPI summary object.
     * @returns {number} Composite penalty score.
     */
    function scoreKpis(k) {
      return (
        k.crewBreaches * 5000 +
        k.flightsCancelled * 1800 +
        k.strandedPax * 22 +
        k.totalDelayMins * 2.5 +
        k.airportOverloads * 800
      );
    }

    /**
     * Generates and ranks rule-validated recovery actions for the current disruption state.
     * @param {Object} dataset - Frozen flight network dataset.
     * @param {Object} state - Current disruption state.
     * @param {Object} currentSim - Current simulation result.
     * @returns {Array<Object>} Ranked list of up to 6 recovery options with KPI deltas.
     */
    function generateRecoveryOptions(dataset, state, currentSim) {
      const baseScore = scoreKpis(currentSim.kpis);
      const candidates = [];
      const usedSpares = new Set((state.spareAssignments || []).map((s) => s.spareId));
      const freeSpares = dataset.spare_aircraft.filter((s) => !usedSpares.has(s.tail_id));

      const pushCandidate = (id, type, title, subtitle, nextState) => {
        const nextSim = runSimulation(dataset, nextState);
        const nextScore = scoreKpis(nextSim.kpis);
        const improvement = baseScore - nextScore;
        if (improvement <= 0) return;

        const deltas = {
          flightsDelayed: nextSim.kpis.flightsDelayed - currentSim.kpis.flightsDelayed,
          flightsCancelled: nextSim.kpis.flightsCancelled - currentSim.kpis.flightsCancelled,
          totalDelayMins: nextSim.kpis.totalDelayMins - currentSim.kpis.totalDelayMins,
          passengersAffected: nextSim.kpis.passengersAffected - currentSim.kpis.passengersAffected,
          missedConnections: nextSim.kpis.missedConnections - currentSim.kpis.missedConnections,
          strandedPax: nextSim.kpis.strandedPax - currentSim.kpis.strandedPax,
          crewBreaches: nextSim.kpis.crewBreaches - currentSim.kpis.crewBreaches,
          airportOverloads: nextSim.kpis.airportOverloads - currentSim.kpis.airportOverloads,
        };

        candidates.push({ id, type, title, subtitle, nextState, sim: nextSim, deltas, improvement });
      };

      // 1. Spare aircraft deployment
      freeSpares.forEach((spare) => {
        const impactedTails = new Set(
          currentSim.flights
            .filter((f) => f.status === 'delayed' || f.status === 'cancelled' || f.isCrewBreach)
            .map((f) => f.tail_id)
        );

        impactedTails.forEach((tailId) => {
          const tailLegs = currentSim.flights
            .filter((f) => f.tail_id === tailId)
            .sort((a, b) => a.leg_order - b.leg_order);

          const eligibleLeg = tailLegs.find(
            (leg) =>
              isSpareEligibleForLeg(spare, leg) &&
              (leg.status === 'delayed' || leg.status === 'cancelled' || leg.isCrewBreach)
          );

          if (eligibleLeg) {
            const nextState = {
              ...state,
              spareAssignments: [
                ...(state.spareAssignments || []),
                { spareId: spare.tail_id, targetTail: tailId, fromLegOrder: eligibleLeg.leg_order },
              ],
            };
            pushCandidate(
              `spare-${spare.tail_id}-${tailId}-${eligibleLeg.leg_order}`,
              'spare',
              `Deploy Spare ${spare.tail_id} at ${spare.base}`,
              `Take over ${tailId} from ${eligibleLeg.flight_id} (${eligibleLeg.dep}) with fresh standby crew.`,
              nextState
            );
          }
        });
      });

      // 2. Hold / Retime connecting flight to rescue missed passenger transfers
      currentSim.connections
        .filter((cx) => cx.status === 'missed')
        .forEach((cx) => {
          const fromF = currentSim.flightMap[cx.from_flight];
          const toF = currentSim.flightMap[cx.to_flight];
          if (!fromF || !toF || fromF.status === 'cancelled' || toF.status === 'cancelled') return;

          const neededHold = cx.min_connect_minutes - cx.connectWindow;
          if (neededHold > 0 && neededHold <= 60) {
            const currentHold = (state.retimes || {})[toF.flight_id] || 0;
            const nextState = {
              ...state,
              retimes: { ...(state.retimes || {}), [toF.flight_id]: currentHold + neededHold },
            };
            const testSim = runSimulation(dataset, nextState);
            if (testSim.kpis.crewBreaches <= currentSim.kpis.crewBreaches) {
              pushCandidate(
                `hold-${cx.connection_id}-${toF.flight_id}`,
                'retime',
                `Hold ${toF.flight_id} by +${neededHold}m at ${cx.airport}`,
                `Protects ${cx.connection_id} (${cx.passengers} pax from ${cx.from_flight}) without breaching crew duty.`,
                nextState
              );
            }
          }
        });

      // 3. Cancel final leg of a breaching crew to restore legal duty compliance
      currentSim.crews
        .filter((c) => c.isBreach)
        .forEach((crew) => {
          const activeLegs = crew.flight_ids
            .map((id) => currentSim.flightMap[id])
            .filter((f) => f && f.status !== 'cancelled' && !f.isSpareOperated);
          const lastLeg = activeLegs[activeLegs.length - 1];
          if (lastLeg) {
            const nextState = {
              ...state,
              cancelledFlights: Array.from(new Set([...(state.cancelledFlights || []), lastLeg.flight_id])),
            };
            pushCandidate(
              `cancel-${lastLeg.flight_id}`,
              'cancel',
              `Cancel ${lastLeg.flight_id} (${lastLeg.origin}→${lastLeg.destination})`,
              `Eliminates ${crew.crew_id} +${crew.breachMins}m duty breach; affects ${lastLeg.pax} pax.`,
              nextState
            );
          }
        });

      return candidates.sort((a, b) => b.improvement - a.improvement).slice(0, 6);
    }

    // ============================================================================
    // 5. BUILT-IN 10-TEST ENGINE VERIFICATION SUITE
    // ============================================================================
    /**
     * Executes 10 deterministic unit tests verifying cascade physics, rules, and immutability.
     * @returns {Array<{name: string, pass: boolean, detail: string}>} Test results.
     */
    function runEngineSelfTests() {
      const results = [];

      // 1. Baseline invariants
      const baseSim = runSimulation(FLIGHT_NETWORK, EMPTY_STATE);
      results.push({
        name: '1. Baseline schedule invariants (70 flights, 0 delays/breaches/missed)',
        pass:
          baseSim.flights.length === 70 &&
          baseSim.crews.length === 16 &&
          baseSim.connections.length === 21 &&
          baseSim.kpis.flightsDelayed === 0 &&
          baseSim.kpis.crewBreaches === 0 &&
          baseSim.kpis.missedConnections === 0,
        detail: `Flights=${baseSim.flights.length}, Delayed=${baseSim.kpis.flightsDelayed}, Breaches=${baseSim.kpis.crewBreaches}, Missed=${baseSim.kpis.missedConnections}`,
      });

      // 2. VT-DS03 +90m tight-turnaround cascade & CR03 +65m breach
      const ds03Sim = runSimulation(FLIGHT_NETWORK, { ...EMPTY_STATE, flightDelays: { DS0301: 90 } });
      const cr03 = ds03Sim.crews.find((c) => c.crew_id === 'CR03');
      const ds0304 = ds03Sim.flightMap['DS0304'];
      results.push({
        name: '2. VT-DS03 +90m cascades (+90/+85/+80/+75m) & triggers CR03 +65m breach',
        pass:
          ds03Sim.kpis.totalDelayMins === 330 &&
          ds0304.actualArr === toMins('22:35') &&
          cr03.breachMins === 65,
        detail: `TotalDelay=${ds03Sim.kpis.totalDelayMins}m (exp 330m), DS0304 Arr=${toHHMM(ds0304.actualArr)}, CR03=+${cr03.breachMins}m`,
      });

      // 3. DS0801 +45m multi-hub ripple breaking CX12 (45 pax) & CR08 +5m breach
      const ds08Sim = runSimulation(FLIGHT_NETWORK, { ...EMPTY_STATE, flightDelays: { DS0801: 45 } });
      const cx12 = ds08Sim.connections.find((c) => c.connection_id === 'CX12');
      const cr08 = ds08Sim.crews.find((c) => c.crew_id === 'CR08');
      results.push({
        name: '3. DS0801 +45m breaks CX12 (20m < 45m, 45 pax) & breaches CR08 (+5m)',
        pass: cx12.isMissed && cx12.connectWindow === 20 && cx12.passengers === 45 && cr08.breachMins === 5,
        detail: `CX12 gap=${cx12.connectWindow}m (min 45m), Stranded=${cx12.passengers}, CR08=+${cr08.breachMins}m`,
      });

      // 4. DEL fog closure 06:00-10:00 ground delay holds
      const fogSim = runSimulation(FLIGHT_NETWORK, {
        ...EMPTY_STATE,
        airportClosures: { DEL: { start: 360, end: 600 } },
      });
      const ds0201 = fogSim.flightMap['DS0201'];
      const ds0101 = fogSim.flightMap['DS0101'];
      results.push({
        name: '4. DEL 06:00–10:00 fog closure holds DS0201 & DS0101 until 10:00',
        pass: ds0201.actualDep === 600 && ds0101.actualDep === 600 && ds0201.closureHold,
        detail: `DS0201 dep=${toHHMM(ds0201.actualDep)} (+${ds0201.delay}m), DS0101 dep=${toHHMM(ds0101.actualDep)} (+${ds0101.delay}m)`,
      });

      // 5. Spare aircraft rule validation (VT-DS18 at DEL valid for DS0301, invalid for BOM)
      const spareDel = FLIGHT_NETWORK.spare_aircraft.find((s) => s.tail_id === 'VT-DS18');
      const legDel = FLIGHT_NETWORK.flights.find((f) => f.flight_id === 'DS0301');
      const legBom = FLIGHT_NETWORK.flights.find((f) => f.flight_id === 'DS0401');
      const recOpts = generateRecoveryOptions(
        FLIGHT_NETWORK,
        { ...EMPTY_STATE, flightDelays: { DS0301: 90 } },
        ds03Sim
      );
      const topOpt = recOpts[0];
      results.push({
        name: '5. Spare rule validation (VT-DS18 valid at DEL, invalid at BOM)',
        pass:
          isSpareEligibleForLeg(spareDel, legDel) === true &&
          isSpareEligibleForLeg(spareDel, legBom) === false &&
          Boolean(topOpt && topOpt.id.includes('VT-DS18') && topOpt.sim.kpis.crewBreaches === 0),
        detail: `DEL eligible=true, BOM eligible=false, #1 Recovery=${topOpt ? topOpt.title : 'none'}`,
      });

      // 6. Hold/Retime DS0504 +25m rescues CX12 without breaching CR05
      const holdSim = runSimulation(FLIGHT_NETWORK, {
        ...EMPTY_STATE,
        flightDelays: { DS0801: 45 },
        retimes: { DS0504: 25 },
      });
      const cx12After = holdSim.connections.find((c) => c.connection_id === 'CX12');
      const cr05After = holdSim.crews.find((c) => c.crew_id === 'CR05');
      results.push({
        name: '6. Hold DS0504 +25m rescues CX12 (45m gap) without breaching CR05',
        pass: !cx12After.isMissed && cx12After.connectWindow === 45 && !cr05After.isBreach,
        detail: `CX12 gap=${cx12After.connectWindow}m (missed=${cx12After.isMissed}), CR05=${cr05After.dutyMins}/600m`,
      });

      // 7. Aircraft Out-of-Service (AOG) cancels all tail legs
      const aogSim = runSimulation(FLIGHT_NETWORK, { ...EMPTY_STATE, aogTails: { 'VT-DS06': 1 } });
      const ds06Cancelled = aogSim.flights.filter(
        (f) => f.tail_id === 'VT-DS06' && f.status === 'cancelled'
      ).length;
      results.push({
        name: '7. Aircraft Out-of-Service (AOG VT-DS06) cancels all 5 scheduled legs',
        pass: ds06Cancelled === 5 && aogSim.kpis.flightsCancelled === 5,
        detail: `VT-DS06 cancelled legs=${ds06Cancelled}/5, Total cancelled=${aogSim.kpis.flightsCancelled}`,
      });

      // 8. Single-leg cancellation breaks turnaround cascade cleanly
      const breakSim = runSimulation(FLIGHT_NETWORK, {
        ...EMPTY_STATE,
        flightDelays: { DS0301: 90 },
        cancelledFlights: ['DS0302'],
      });
      const ds0303After = breakSim.flightMap['DS0303'];
      const ds0304After = breakSim.flightMap['DS0304'];
      results.push({
        name: '8. Cancelling DS0302 breaks VT-DS03 turnaround cascade cleanly',
        pass: ds0303After.delay === 0 && ds0304After.delay === 0,
        detail: `DS0302=CXL, DS0303 delay=${ds0303After.delay}m, DS0304 delay=${ds0304After.delay}m`,
      });

      // 9. Airport hourly capacity overload detection
      const tightCapDataset = {
        ...FLIGHT_NETWORK,
        airports: FLIGHT_NETWORK.airports.map((a) =>
          a.id === 'DEL' ? { ...a, capacity_per_hour: 1 } : a
        ),
      };
      const overloadSim = runSimulation(tightCapDataset, EMPTY_STATE);
      const delOverload = overloadSim.airports.find((a) => a.id === 'DEL');
      results.push({
        name: '9. Airport hourly capacity overload detection flags exceeded cap',
        pass: delOverload.isOverloaded && overloadSim.kpis.airportOverloads >= 1,
        detail: `DEL cap=1/hr, peak=${delOverload.peakMovements}/hr, overloads=${overloadSim.kpis.airportOverloads}`,
      });

      // 10. Pure-function immutability & input clamping
      const dirtyState = { flightDelays: { DS0301: 9999, DS0101: -50 }, retimes: { DS0504: 999 } };
      const dirtySnapshot = JSON.stringify(dirtyState);
      const clampedSim = runSimulation(FLIGHT_NETWORK, dirtyState);
      results.push({
        name: '10. Pure-function immutability & numeric clamping (0..360m)',
        pass:
          Object.isFrozen(FLIGHT_NETWORK) &&
          JSON.stringify(dirtyState) === dirtySnapshot &&
          clampedSim.flightMap['DS0301'].delay === 360 &&
          clampedSim.flightMap['DS0101'].delay === 0,
        detail: `Frozen=${Object.isFrozen(FLIGHT_NETWORK)}, DS0301 clamped=${clampedSim.flightMap['DS0301'].delay}m, DS0101=${clampedSim.flightMap['DS0101'].delay}m`,
      });

      return results;
    }

    // ============================================================================
    // 6. REACT ERROR BOUNDARY
    // ============================================================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#0A0A0B] text-[#F5F5F7] flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-[#131316] border border-[#E14949]/60 rounded-lg p-6 text-center">
                <h1 className="text-base font-bold text-[#FCA5A5] mb-2">Operations Display Fault</h1>
                <p className="text-xs text-[#B4B4BF] mb-4">{this.state.message}</p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 rounded-md bg-[#F2D6B3] text-[#0A0A0B] text-xs font-bold cursor-pointer"
                >
                  Reload Control Center
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // 7. ACCESSIBLE SUB-COMPONENTS (OBSIDIAN & CHAMPAGNE GOLD)
    // ============================================================================
    function KpiItem({ title, value, subtext, severity, delta, inverseDelta = true }) {
      const dotColor = {
        neutral: 'bg-[#A8A8B3]',
        good: 'bg-[#34D399]',
        warn: 'bg-[#E3B987]',
        danger: 'bg-[#E14949] animate-pulse',
      }[severity || 'neutral'];

      const valueColor = {
        neutral: 'text-[#F5F5F7]',
        good: 'text-[#F5F5F7]',
        warn: 'text-[#F2D6B3]',
        danger: 'text-[#FCA5A5]',
      }[severity || 'neutral'];

      const hasDelta = typeof delta === 'number' && delta !== 0;
      const isGoodDelta = inverseDelta ? delta < 0 : delta > 0;

      return (
        <div className="px-4 py-3 flex flex-col justify-center min-w-0">
          <div className="flex items-center gap-1.5 mb-1">
            <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${dotColor}`} aria-hidden="true" />
            <span className="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#B4B4BF] truncate">
              {title}
            </span>
          </div>
          <div className="flex items-baseline gap-2">
            <span className={`text-xl font-semibold font-mono tabular-nums tracking-tight ${valueColor}`}>
              {value}
            </span>
            {hasDelta && (
              <span
                className={`text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.5 rounded-sm ${
                  isGoodDelta ? 'bg-[#F2D6B3] text-[#0A0A0B]' : 'bg-[#E14949]/30 text-[#FCA5A5]'
                }`}
              >
                {delta > 0 ? `+${delta}` : delta}
              </span>
            )}
          </div>
          <div className="text-[11px] text-[#A8A8B3] mt-0.5 truncate">{subtext}</div>
        </div>
      );
    }

    function DominoCascadeStrip({ sim, selectedFlightId, onSelectFlight, expanded, onToggle }) {
      const selected = sim.flightMap[selectedFlightId] || sim.flights[0];
      if (!selected) return null;

      const tailLegs = sim.flights
        .filter((f) => f.tail_id === selected.tail_id)
        .sort((a, b) => a.leg_order - b.leg_order);
      const crew = sim.crews.find((c) => c.tail_id === selected.tail_id);

      const tailConnMap = {};
      sim.connections.forEach((cx) => {
        if (tailLegs.some((l) => l.flight_id === cx.from_flight)) {
          if (!tailConnMap[cx.from_flight]) tailConnMap[cx.from_flight] = [];
          tailConnMap[cx.from_flight].push(cx);
        }
      });

      return (
        <section
          aria-label={`Domino chain for aircraft ${selected.tail_id}`}
          className="bg-[#131316] border border-[#26262F] rounded-lg overflow-hidden"
        >
          <button
            type="button"
            onClick={onToggle}
            aria-expanded={expanded}
            aria-controls="domino-chain-panel"
            className="w-full px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 hover:bg-[#191920] transition-colors cursor-pointer text-left"
          >
            <div className="flex items-center gap-2.5">
              <Radio className="w-3.5 h-3.5 text-[#E3B987]" />
              <span className="text-xs font-semibold text-[#F5F5F7]">
                Domino Chain · <span className="font-mono text-[#F2D6B3]">{selected.tail_id}</span>
              </span>
              <span className="text-xs text-[#A8A8B3] font-mono">
                {tailLegs.map((l) => l.origin).join(' → ')} → {tailLegs[tailLegs.length - 1]?.destination}
              </span>
            </div>

            <div className="flex items-center gap-3">
              {crew?.isBreach ? (
                <span className="text-[11px] font-mono font-semibold px-2 py-0.5 rounded bg-[#E14949]/25 text-[#FCA5A5]">
                  BREACH: {crew.crew_id} +{crew.breachMins}m
                </span>
              ) : (
                <span className="text-[11px] font-mono text-[#B4B4BF]">
                  {crew?.crew_id} · {crew?.headroomMins ?? 0}m buffer
                </span>
              )}
              <span className="text-[11px] text-[#B4B4BF] flex items-center gap-1">
                {expanded ? 'Hide' : 'Inspect'}
                <ChevronDown className={`w-3.5 h-3.5 transition-transform ${expanded ? 'rotate-180' : ''}`} />
              </span>
            </div>
          </button>

          {expanded && (
            <div
              id="domino-chain-panel"
              className="px-4 pb-3.5 pt-2 border-t border-[#22222A] flex items-center gap-2 overflow-x-auto"
            >
              {tailLegs.map((leg, idx) => {
                const isSelected = leg.flight_id === selectedFlightId;
                const prevLeg = idx > 0 ? tailLegs[idx - 1] : null;
                const actualTurn =
                  prevLeg && prevLeg.status !== 'cancelled' && leg.status !== 'cancelled'
                    ? leg.actualDep - prevLeg.actualArr
                    : null;
                const isTightTurn = actualTurn !== null && actualTurn <= 35;
                const outboundConns = tailConnMap[leg.flight_id] || [];

                let cardTone = 'bg-[#18191F] border-[#32333E] text-[#F5F5F7]';
                if (leg.status === 'cancelled') {
                  cardTone = 'bg-[#151519] border-[#383844] text-[#A8A8B3]';
                } else if (leg.isCrewBreach) {
                  cardTone = 'bg-[#281418] border-[#E14949] text-[#FFFFFF]';
                } else if (leg.status === 'delayed') {
                  cardTone = 'bg-[#231B14] border-[#E3B987]/80 text-[#F2D6B3]';
                } else if (leg.isSpareOperated) {
                  cardTone = 'bg-[#141D2E] border-[#4E80EE]/80 text-[#DBEAFE]';
                }

                return (
                  <React.Fragment key={leg.flight_id}>
                    {idx > 0 && (
                      <div className="flex flex-col items-center shrink-0 px-1" aria-hidden="true">
                        <span
                          className={`text-[10px] font-mono tabular-nums ${
                            isTightTurn && leg.delay > 0 ? 'text-[#F2D6B3] font-bold' : 'text-[#A8A8B3]'
                          }`}
                        >
                          {actualTurn === null ? '—' : `${actualTurn}m`}
                        </span>
                        <ChevronRight
                          className={`w-3.5 h-3.5 ${
                            isTightTurn && leg.delay > 0 ? 'text-[#E3B987]' : 'text-[#6E6E7C]'
                          }`}
                        />
                      </div>
                    )}

                    <button
                      type="button"
                      onClick={() => onSelectFlight(leg.flight_id)}
                      aria-label={`Select flight ${leg.flight_id} from ${leg.origin} to ${leg.destination}, status ${leg.isCrewBreach ? 'crew breach' : leg.status}, delay ${leg.delay} minutes`}
                      aria-pressed={isSelected}
                      className={`shrink-0 min-w-[152px] rounded-md border px-3 py-2 text-left transition-all cursor-pointer ${cardTone} ${
                        isSelected ? 'ring-2 ring-[#F2D6B3] border-[#F2D6B3]' : 'hover:border-[#626273]'
                      }`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-mono text-[11px] font-bold">{leg.flight_id}</span>
                        {leg.status === 'cancelled' ? (
                          <span className="text-[10px] font-mono font-semibold text-[#D4D4D8]">CXL</span>
                        ) : leg.delay > 0 ? (
                          <span
                            className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded-sm ${
                              leg.isCrewBreach ? 'bg-[#E14949] text-white' : 'bg-[#F2D6B3] text-[#0A0A0B]'
                            }`}
                          >
                            +{leg.delay}m
                          </span>
                        ) : (
                          <span className="text-[10px] font-mono text-[#6EE7B7]">OK</span>
                        )}
                      </div>

                      <div className="flex items-center justify-between font-mono text-xs font-semibold mt-1">
                        <span>{leg.origin} → {leg.destination}</span>
                        <span className="text-[10px] font-normal text-[#B4B4BF]">{leg.pax}p</span>
                      </div>

                      <div className="text-[10px] font-mono tabular-nums text-[#B4B4BF] mt-0.5">
                        {leg.status === 'cancelled'
                          ? `${leg.dep}–${leg.arr}`
                          : `${toHHMM(leg.actualDep)}–${toHHMM(leg.actualArr)}`}
                      </div>

                      {outboundConns.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-1.5 pt-1.5 border-t border-white/15">
                          {outboundConns.map((cx) => (
                            <span
                              key={cx.connection_id}
                              className={`text-[9px] font-mono px-1.5 py-0.5 rounded-sm ${
                                cx.isMissed
                                  ? 'bg-[#E14949] text-white font-semibold'
                                  : 'bg-[#192420] text-[#6EE7B7]'
                              }`}
                            >
                              {cx.connection_id} {cx.isMissed ? 'MISSED' : 'OK'} {cx.passengers}p
                            </span>
                          ))}
                        </div>
                      )}
                    </button>
                  </React.Fragment>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    const GANTT_START = 300;
    const GANTT_END = 1440;
    const GANTT_SPAN = GANTT_END - GANTT_START;

    function GanttTimeline({ sim, state, selectedFlightId, onSelectFlight }) {
      const [hoveredFlight, setHoveredFlight] = useState(null);
      const [fleetFilter, setFleetFilter] = useState('all');

      const hours = useMemo(() => {
        const arr = [];
        for (let h = 5; h <= 24; h++) arr.push(h);
        return arr;
      }, []);

      const connFlightIds = useMemo(() => {
        const missed = new Set();
        sim.connections.forEach((c) => {
          if (c.isMissed) {
            missed.add(c.from_flight);
            missed.add(c.to_flight);
          }
        });
        return missed;
      }, [sim.connections]);

      const allRows = useMemo(() => {
        const baseTails = FLIGHT_NETWORK.crews.map((c) => c.tail_id);
        const activeSpares = (state.spareAssignments || []).map((s) => s.spareId);
        const allTails = [...baseTails, ...Array.from(new Set(activeSpares))];

        return allTails.map((tailId) => {
          const isSpare = tailId === 'VT-DS17' || tailId === 'VT-DS18';
          const flights = sim.flights
            .filter((f) => f.effectiveTail === tailId)
            .sort((a, b) => a.schedDep - b.schedDep);
          const crew = sim.crews.find((c) => c.tail_id === tailId) || null;
          const isAog = state.aogTails?.[tailId] != null;
          const isImpacted =
            isSpare ||
            isAog ||
            Boolean(crew?.isBreach) ||
            flights.some((f) => f.status === 'delayed' || f.status === 'cancelled');
          const isCrewRisk = Boolean(crew && (crew.isBreach || crew.utilizationPct >= 95));
          return { tailId, isSpare, flights, crew, isAog, isImpacted, isCrewRisk };
        });
      }, [sim, state]);

      const rows = useMemo(() => {
        if (fleetFilter === 'impacted') return allRows.filter((r) => r.isImpacted);
        if (fleetFilter === 'crew_risk') return allRows.filter((r) => r.isCrewRisk);
        return allRows;
      }, [allRows, fleetFilter]);

      const impactedCount = useMemo(() => allRows.filter((r) => r.isImpacted).length, [allRows]);
      const crewRiskCount = useMemo(() => allRows.filter((r) => r.isCrewRisk).length, [allRows]);

      const toPct = (mins) => Math.max(0, Math.min(100, ((mins - GANTT_START) / GANTT_SPAN) * 100));

      return (
        <section
          aria-labelledby="gantt-heading"
          className="flex flex-col h-full bg-[#131316] border border-[#26262F] rounded-lg overflow-hidden"
        >
          <div className="flex flex-wrap items-center justify-between gap-3 px-4 py-3 bg-[#17171D] border-b border-[#26262F]">
            <div className="flex flex-wrap items-center gap-3">
              <h2 id="gantt-heading" className="sr-only">
                Fleet Gantt Timeline
              </h2>
              <div
                role="group"
                aria-label="Filter aircraft rows"
                className="flex items-center gap-1 bg-[#0C0C0F] p-0.5 rounded-md border border-[#2C2C36] text-[11px]"
              >
                {[
                  { id: 'all', label: `All Aircraft (${allRows.length})` },
                  { id: 'impacted', label: `Impacted (${impactedCount})` },
                  { id: 'crew_risk', label: `Crew ≥95% (${crewRiskCount})` },
                ].map((f) => (
                  <button
                    key={f.id}
                    type="button"
                    aria-pressed={fleetFilter === f.id}
                    onClick={() => setFleetFilter(f.id)}
                    className={`px-2.5 py-1 rounded transition-colors cursor-pointer ${
                      fleetFilter === f.id
                        ? 'bg-[#F2D6B3] text-[#0A0A0B] font-semibold'
                        : 'text-[#B4B4BF] hover:text-[#F5F5F7]'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-4 text-[11px] text-[#B4B4BF]" aria-label="Status legend">
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#34D399]" aria-hidden="true" /> On Time
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#C88A5B]" aria-hidden="true" /> Delayed
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#E14949]" aria-hidden="true" /> Crew Breach
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-sm border border-[#71717A]" style={CANCELLED_HATCH_STYLE} aria-hidden="true" /> Cancelled
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-[#4E80EE]" aria-hidden="true" /> Spare
              </span>
            </div>
          </div>

          <div className="flex-1 overflow-auto relative bg-[#0C0C0F]">
            {rows.length === 0 ? (
              <div className="h-64 flex flex-col items-center justify-center text-center px-4">
                <Filter className="w-5 h-5 text-[#A8A8B3] mb-2" />
                <div className="text-xs text-[#D4D4D8]">No aircraft match this filter</div>
                <button
                  type="button"
                  onClick={() => setFleetFilter('all')}
                  className="mt-2 text-xs text-[#F2D6B3] underline cursor-pointer"
                >
                  Show all aircraft
                </button>
              </div>
            ) : (
              <div className="min-w-[820px]">
                <div className="sticky top-0 z-20 flex items-center bg-[#15151B]/95 backdrop-blur border-b border-[#26262F] text-[10px] font-mono tabular-nums text-[#B4B4BF]">
                  <div className="w-28 shrink-0 px-3.5 py-2.5 border-r border-[#26262F] font-semibold uppercase tracking-wider text-[#D4D4D8]">
                    Tail
                  </div>
                  <div className="flex-1 relative h-8" aria-hidden="true">
                    {hours.map((h) => {
                      if (h % 2 !== 0 && h !== 5 && h !== 24) return null;
                      const left = toPct(h * 60);
                      return (
                        <div
                          key={h}
                          className="absolute top-0 bottom-0 flex items-center border-l border-[#22222B] pl-1.5"
                          style={{ left: `${left}%` }}
                        >
                          {h < 24 ? `${String(h).padStart(2, '0')}:00` : ''}
                        </div>
                      );
                    })}
                  </div>
                  <div className="w-36 shrink-0 px-3.5 py-2.5 border-l border-[#26262F] font-semibold uppercase tracking-wider text-[#D4D4D8] text-right">
                    Crew Duty
                  </div>
                </div>

                <div className="divide-y divide-[#1A1A22]">
                  {rows.map(({ tailId, isSpare, flights, crew, isAog }) => (
                    <div
                      key={tailId}
                      className={`flex items-center h-[52px] transition-colors ${
                        isSpare
                          ? 'bg-[#4E80EE]/[0.07]'
                          : isAog
                          ? 'bg-[#E14949]/[0.07]'
                          : 'hover:bg-[#14141A]'
                      }`}
                    >
                      <div className="w-28 shrink-0 px-3.5 border-r border-[#22222A] flex flex-col justify-center">
                        <div className="flex items-center gap-1.5">
                          <span
                            className={`font-mono text-xs font-semibold ${
                              isSpare ? 'text-[#93C5FD]' : 'text-[#F5F5F7]'
                            }`}
                          >
                            {tailId}
                          </span>
                          {isAog && (
                            <span className="text-[9px] font-mono font-bold px-1 rounded-sm bg-[#E14949]/25 text-[#FCA5A5]">
                              AOG
                            </span>
                          )}
                          {isSpare && (
                            <span className="text-[9px] font-mono font-bold px-1 rounded-sm bg-[#4E80EE]/30 text-[#BFDBFE]">
                              SPARE
                            </span>
                          )}
                        </div>
                        <span className="text-[10px] text-[#A8A8B3] font-mono">
                          {crew ? `${crew.crew_id} · ${crew.base}` : 'Standby'}
                        </span>
                      </div>

                      <div className="flex-1 relative h-full">
                        {hours.map((h) =>
                          h % 2 === 0 ? (
                            <div
                              key={h}
                              aria-hidden="true"
                              className="absolute top-0 bottom-0 border-l border-[#181820] pointer-events-none"
                              style={{ left: `${toPct(h * 60)}%` }}
                            />
                          ) : null
                        )}

                        {Object.entries(state.airportClosures || {}).map(([ap, win]) => (
                          <div
                            key={ap}
                            aria-hidden="true"
                            className="absolute top-0 bottom-0 bg-[#E3B987]/[0.08] border-x border-[#E3B987]/35 pointer-events-none"
                            style={{
                              left: `${toPct(win.start)}%`,
                              width: `${Math.max(0.5, toPct(win.end) - toPct(win.start))}%`,
                            }}
                          />
                        ))}

                        {flights.map((f, idx) => {
                          if (idx === 0 || f.status === 'cancelled') return null;
                          const prev = flights[idx - 1];
                          if (!prev || prev.status === 'cancelled') return null;
                          const gap = f.actualDep - prev.actualArr;
                          const left = toPct(prev.actualArr);
                          const width = Math.max(0.2, toPct(f.actualDep) - left);
                          const isCompressed = gap <= 32 && f.delay > 0;
                          return (
                            <div
                              key={`turn-${f.flight_id}`}
                              aria-hidden="true"
                              className={`absolute top-1/2 -translate-y-1/2 h-[2px] pointer-events-none ${
                                isCompressed ? 'bg-[#E3B987]' : 'bg-[#2A2A35]'
                              }`}
                              style={{ left: `${left}%`, width: `${width}%` }}
                            />
                          );
                        })}

                        {flights.map((f) => {
                          const isSelected = f.flight_id === selectedFlightId;
                          const schedLeft = toPct(f.schedDep);
                          const schedWidth = Math.max(1.2, toPct(f.schedArr) - schedLeft);
                          const actLeft = toPct(f.actualDep);
                          const actWidth = Math.max(1.6, toPct(f.actualArr) - actLeft);
                          const hasMissedConn = connFlightIds.has(f.flight_id);

                          let barClass =
                            'bg-[#232730] hover:bg-[#2E3440] border-[#4A5363] text-[#F5F5F7]';
                          let barExtraStyle = {};

                          if (f.status === 'cancelled') {
                            barClass = 'border-[#52525E] text-[#D4D4D8] line-through opacity-90 hover:opacity-100';
                            barExtraStyle = CANCELLED_HATCH_STYLE;
                          } else if (f.isCrewBreach) {
                            barClass =
                              'bg-[#E14949] hover:brightness-110 border-[#FCA5A5] text-[#FFFFFF] shadow-[0_0_12px_rgba(225,73,73,0.45)]';
                          } else if (f.status === 'delayed') {
                            barClass =
                              'bg-[#C88A5B] hover:brightness-105 border-[#F2D6B3] text-[#0A0A0B] font-bold';
                          } else if (f.isSpareOperated) {
                            barClass =
                              'bg-[#4E80EE] hover:brightness-110 border-[#93C5FD] text-[#FFFFFF] font-semibold';
                          }

                          return (
                            <React.Fragment key={f.flight_id}>
                              {f.status === 'delayed' && (
                                <div
                                  aria-hidden="true"
                                  className="absolute top-3.5 bottom-3.5 rounded-sm border border-dashed border-[#6E6E7C]/60 pointer-events-none"
                                  style={{ left: `${schedLeft}%`, width: `${schedWidth}%` }}
                                />
                              )}
                              <button
                                type="button"
                                onClick={() => onSelectFlight(f.flight_id)}
                                onMouseEnter={() => setHoveredFlight(f)}
                                onMouseLeave={() => setHoveredFlight(null)}
                                onFocus={() => setHoveredFlight(f)}
                                onBlur={() => setHoveredFlight(null)}
                                aria-label={`Flight ${f.flight_id}, ${f.origin} to ${f.destination}, ${f.status === 'cancelled' ? 'cancelled' : `${toHHMM(f.actualDep)} to ${toHHMM(f.actualArr)}, ${f.delay > 0 ? `delayed ${f.delay} minutes` : 'on time'}`}${f.isCrewBreach ? ', crew duty breach' : ''}`}
                                aria-pressed={isSelected}
                                className={`absolute top-2.5 bottom-2.5 rounded border px-1.5 flex items-center justify-between gap-1 text-[10px] font-mono tabular-nums overflow-hidden transition-all cursor-pointer ${barClass} ${
                                  isSelected
                                    ? 'ring-2 ring-[#F2D6B3] ring-offset-1 ring-offset-[#0C0C0F] z-10'
                                    : 'z-0'
                                }`}
                                style={{
                                  left: `${actLeft}%`,
                                  width: `${actWidth}%`,
                                  ...barExtraStyle,
                                }}
                                title={`${f.flight_id}: ${f.origin}→${f.destination} | ${toHHMM(f.actualDep)}-${toHHMM(f.actualArr)}`}
                              >
                                <span className="truncate flex items-center gap-1">
                                  {hasMissedConn && (
                                    <span
                                      className="w-1.5 h-1.5 rounded-full bg-[#E14949] ring-1 ring-white shrink-0"
                                      aria-hidden="true"
                                    />
                                  )}
                                  {f.origin}-{f.destination}
                                </span>
                                {f.delay > 0 && f.status !== 'cancelled' && (
                                  <span
                                    className={`text-[9px] px-1 rounded-sm shrink-0 font-bold ${
                                      f.isCrewBreach ? 'bg-black/30 text-white' : 'bg-black/20 text-[#0A0A0B]'
                                    }`}
                                  >
                                    +{f.delay}
                                  </span>
                                )}
                              </button>
                            </React.Fragment>
                          );
                        })}
                      </div>

                      <div className="w-36 shrink-0 px-3.5 border-l border-[#22222A] flex flex-col justify-center">
                        {crew ? (
                          <>
                            <div className="flex items-center justify-between text-[10px] font-mono tabular-nums mb-1.5">
                              <span
                                className={
                                  crew.isBreach
                                    ? 'text-[#FCA5A5] font-semibold'
                                    : crew.utilizationPct >= 95
                                    ? 'text-[#F2D6B3]'
                                    : 'text-[#D4D4D8]'
                                }
                              >
                                {crew.dutyMins}m
                              </span>
                              <span
                                className={
                                  crew.isBreach
                                    ? 'text-[#FCA5A5] font-bold'
                                    : crew.utilizationPct >= 95
                                    ? 'text-[#F2D6B3]'
                                    : 'text-[#A8A8B3]'
                                }
                              >
                                {crew.isBreach ? `+${crew.breachMins}m` : `${crew.utilizationPct}%`}
                              </span>
                            </div>
                            <div
                              className="h-1.5 w-full rounded-full bg-[#22222B] overflow-hidden"
                              role="progressbar"
                              aria-label={`${crew.crew_id} duty utilization`}
                              aria-valuenow={crew.dutyMins}
                              aria-valuemin={0}
                              aria-valuemax={crew.max_duty_mins}
                            >
                              <div
                                className={`h-full rounded-full transition-all duration-300 ${
                                  crew.isBreach
                                    ? 'bg-[#E14949]'
                                    : crew.utilizationPct >= 95
                                    ? 'bg-[#E3B987]'
                                    : 'bg-[#64748B]'
                                }`}
                                style={{ width: `${Math.min(100, crew.utilizationPct)}%` }}
                              />
                            </div>
                          </>
                        ) : (
                          <span className="text-[10px] font-mono text-[#93C5FD] text-right">
                            Fresh Crew
                          </span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div
            aria-live="polite"
            className="px-4 py-2.5 bg-[#17171D] border-t border-[#26262F] text-xs flex items-center justify-between gap-4 min-h-[40px]"
          >
            {hoveredFlight ? (
              <div className="flex flex-wrap items-center gap-x-4 gap-y-1 font-mono tabular-nums text-[11px]">
                <span className="font-bold text-[#F2D6B3]">{hoveredFlight.flight_id}</span>
                <span className="text-[#F5F5F7]">
                  {hoveredFlight.origin} → {hoveredFlight.destination}
                </span>
                <span className="text-[#B4B4BF]">
                  Sched {hoveredFlight.dep}–{hoveredFlight.arr}
                </span>
                <span className="text-[#F5F5F7]">
                  Actual{' '}
                  {hoveredFlight.status === 'cancelled'
                    ? 'CANCELLED'
                    : `${toHHMM(hoveredFlight.actualDep)}–${toHHMM(hoveredFlight.actualArr)}`}
                </span>
                <span className="text-[#B4B4BF]">{hoveredFlight.pax} pax</span>
                {hoveredFlight.delay > 0 && (
                  <span className="text-[#F2D6B3] font-semibold">+{hoveredFlight.delay}m</span>
                )}
                {hoveredFlight.isCrewBreach && (
                  <span className="text-[#FCA5A5] font-semibold">● Crew Breach</span>
                )}
              </div>
            ) : (
              <span className="text-[#A8A8B3] text-xs">
                Click or focus any flight bar to inspect or inject a delay · Hover for live timing
              </span>
            )}
          </div>
        </section>
      );
    }

    function NetworkRadarMap({ sim, onSelectFlight }) {
      const [selectedAirportId, setSelectedAirportId] = useState('DEL');

      const project = useCallback((lat, lng) => {
        const x = ((lng - 68.0) / (95.5 - 68.0)) * 560 + 20;
        const y = ((33.5 - lat) / (33.5 - 7.0)) * 560 + 20;
        return { x, y };
      }, []);

      const airportMap = useMemo(() => {
        const m = {};
        sim.airports.forEach((a) => {
          m[a.id] = { ...a, ...project(a.lat, a.lng) };
        });
        return m;
      }, [sim.airports, project]);

      const routes = useMemo(() => {
        const map = {};
        sim.flights.forEach((f) => {
          const key = [f.origin, f.destination].sort().join('-');
          if (!map[key]) {
            map[key] = { key, a: f.origin, b: f.destination, flights: [], worst: 'on_time', maxDelay: 0 };
          }
          map[key].flights.push(f);
          if (f.delay > map[key].maxDelay) map[key].maxDelay = f.delay;
          if (f.status === 'cancelled') map[key].worst = 'cancelled';
          else if (f.isCrewBreach && map[key].worst !== 'cancelled') map[key].worst = 'breach';
          else if (f.status === 'delayed' && map[key].worst === 'on_time') map[key].worst = 'delayed';
        });
        return Object.values(map);
      }, [sim.flights]);

      const selectedAirport = airportMap[selectedAirportId] || sim.airports[0];
      const airportFlights = useMemo(
        () =>
          sim.flights
            .filter((f) => f.origin === selectedAirport?.id || f.destination === selectedAirport?.id)
            .sort((a, b) => a.actualDep - b.actualDep),
        [sim.flights, selectedAirport]
      );

      const indiaOutlinePoints = useMemo(() => {
        const coords = [
          [32.8, 74.8], [32.2, 77.5], [30.0, 80.2], [27.8, 83.5], [27.2, 88.2],
          [27.8, 92.0], [26.8, 95.0], [24.2, 93.2], [22.0, 89.0], [21.5, 87.2],
          [19.5, 85.2], [16.5, 82.2], [13.0, 80.3], [10.0, 79.2], [8.1, 77.5],
          [9.5, 76.2], [12.8, 74.8], [15.5, 73.7], [19.0, 72.8], [21.5, 72.6],
          [22.5, 69.0], [24.0, 70.8], [26.8, 70.5], [29.8, 73.8], [32.8, 74.8],
        ];
        return coords
          .map(([la, ln]) => {
            const p = project(la, ln);
            return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
          })
          .join(' ');
      }, [project]);

      const radarCenter = project(20.5, 79.0);

      return (
        <section aria-labelledby="radar-heading" className="grid grid-cols-1 lg:grid-cols-12 gap-4 h-full">
          <div className="lg:col-span-8 bg-[#131316] border border-[#26262F] rounded-lg overflow-hidden flex flex-col">
            <div className="px-4 py-3 bg-[#17171D] border-b border-[#26262F] flex items-center justify-between text-xs">
              <h2 id="radar-heading" className="font-semibold text-[#F2D6B3] flex items-center gap-2">
                <MapIcon className="w-3.5 h-3.5 text-[#E3B987]" />
                Network Radar · 16 Stations
              </h2>
              <div className="flex items-center gap-4 text-[11px] text-[#B4B4BF]">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#64748B]" aria-hidden="true" /> On Time</span>
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#C88A5B]" aria-hidden="true" /> Delayed</span>
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-[#E14949]" aria-hidden="true" /> Breach / CXL</span>
              </div>
            </div>
            <div className="flex-1 flex items-center justify-center p-2 relative min-h-[440px] bg-[#09090C]">
              <svg
                viewBox="0 0 600 600"
                role="img"
                aria-label="Interactive India flight network radar map showing 16 airports and route disruption status"
                className="w-full h-full max-h-[540px] select-none"
              >
                <title>Domino Sky India Network Radar Map</title>
                <defs>
                  <radialGradient id="obsidianRadar" cx="50%" cy="50%" r="55%">
                    <stop offset="0%" stopColor="#1A1816" />
                    <stop offset="55%" stopColor="#101014" />
                    <stop offset="100%" stopColor="#08080A" />
                  </radialGradient>
                  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>
                <rect width="600" height="600" fill="url(#obsidianRadar)" />

                {[85, 165, 245].map((r) => (
                  <circle
                    key={r}
                    cx={radarCenter.x}
                    cy={radarCenter.y}
                    r={r}
                    fill="none"
                    stroke="#2A2622"
                    strokeWidth="0.9"
                    strokeDasharray="4 6"
                  />
                ))}

                <line x1={radarCenter.x} y1="15" x2={radarCenter.x} y2="585" stroke="#222228" strokeWidth="0.7" />
                <line x1="15" y1={radarCenter.y} x2="585" y2={radarCenter.y} stroke="#222228" strokeWidth="0.7" />

                <polygon
                  points={indiaOutlinePoints}
                  fill="#141419"
                  stroke="#524D46"
                  strokeWidth="1.4"
                  strokeLinejoin="round"
                />

                {routes.map((r) => {
                  const p1 = airportMap[r.a];
                  const p2 = airportMap[r.b];
                  if (!p1 || !p2) return null;
                  const mx = (p1.x + p2.x) / 2;
                  const my = (p1.y + p2.y) / 2 - 16;
                  const stroke =
                    r.worst === 'cancelled' || r.worst === 'breach'
                      ? '#E14949'
                      : r.worst === 'delayed'
                      ? '#C88A5B'
                      : '#64748B';
                  const opacity = r.worst === 'on_time' ? 0.4 : 0.94;
                  const width = r.worst === 'on_time' ? 1.4 : 2.6;

                  return (
                    <g key={r.key}>
                      <path
                        d={`M ${p1.x} ${p1.y} Q ${mx} ${my} ${p2.x} ${p2.y}`}
                        fill="none"
                        stroke={stroke}
                        strokeWidth={width}
                        strokeOpacity={opacity}
                        strokeDasharray={r.worst === 'cancelled' ? '5 4' : undefined}
                        filter={r.worst !== 'on_time' ? 'url(#softGlow)' : undefined}
                      />
                      {r.worst !== 'on_time' && (
                        <circle cx={mx} cy={my + 6} r="3" fill={stroke} opacity="0.95" />
                      )}
                    </g>
                  );
                })}

                {Object.values(airportMap).map((ap) => {
                  const isSelected = ap.id === selectedAirportId;
                  const radius = ap.tier === 'mega_hub' ? 7 : ap.tier === 'regional_hub' ? 5.2 : 4;
                  const isClosed = Boolean(ap.closure);
                  const fill = isClosed
                    ? '#E14949'
                    : ap.isOverloaded
                    ? '#C88A5B'
                    : ap.tier === 'mega_hub'
                    ? '#F2D6B3'
                    : '#94A3B8';

                  return (
                    <g
                      key={ap.id}
                      role="button"
                      tabIndex={0}
                      aria-label={`Select airport ${ap.id}, ${ap.city}${isClosed ? ', currently closed' : ''}${ap.isOverloaded ? ', capacity overloaded' : ''}`}
                      aria-pressed={isSelected}
                      className="cursor-pointer focus:outline-none"
                      onClick={() => setSelectedAirportId(ap.id)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                          e.preventDefault();
                          setSelectedAirportId(ap.id);
                        }
                      }}
                    >
                      {(isClosed || ap.isOverloaded || isSelected) && (
                        <circle
                          cx={ap.x}
                          cy={ap.y}
                          r={radius + 7}
                          fill={isClosed ? '#E14949' : '#F2D6B3'}
                          fillOpacity="0.16"
                          stroke={isClosed ? '#E14949' : ap.isOverloaded ? '#C88A5B' : '#F2D6B3'}
                          strokeWidth="1.5"
                        />
                      )}
                      <circle
                        cx={ap.x}
                        cy={ap.y}
                        r={radius}
                        fill={fill}
                        stroke="#0A0A0B"
                        strokeWidth="1.5"
                        filter={ap.tier === 'mega_hub' || isClosed ? 'url(#softGlow)' : undefined}
                      />
                      <text
                        x={ap.x + radius + 5}
                        y={ap.y + 3}
                        fill={isSelected ? '#F2D6B3' : '#F5F5F7'}
                        fontSize={ap.tier === 'mega_hub' ? '11.5' : '9.5'}
                        fontWeight="700"
                        fontFamily="monospace"
                      >
                        {ap.id}
                      </text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>

          <div className="lg:col-span-4 bg-[#131316] border border-[#26262F] rounded-lg p-4 flex flex-col gap-4 overflow-auto">
            {selectedAirport && (
              <>
                <div className="flex items-start justify-between gap-2 border-b border-[#2A2A34] pb-3">
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-xl font-bold font-mono tracking-wider text-[#F2D6B3]">
                        {selectedAirport.id}
                      </h3>
                      <span className="text-[10px] uppercase tracking-wider px-1.5 py-0.5 bg-[#1E1E26] text-[#E4E4E7] border border-[#3A3A46] font-semibold">
                        {selectedAirport.tier.replace('_', ' ')}
                      </span>
                    </div>
                    <div className="text-xs text-[#F5F5F7] mt-0.5">{selectedAirport.name}</div>
                    <div className="text-[11px] text-[#A8A8B3] font-mono">
                      {selectedAirport.city} · {selectedAirport.lat.toFixed(2)}°N, {selectedAirport.lng.toFixed(2)}°E
                    </div>
                  </div>
                  {selectedAirport.closure && (
                    <span className="text-[10px] font-mono font-bold px-2 py-1 bg-[#E14949]/25 text-[#FCA5A5] border border-[#E14949]/60">

                    </span>
                  )}
                </div>

                <div>
                  <div className="flex items-center justify-between text-xs mb-2">
                    <span className="font-semibold uppercase tracking-wider text-[10px] text-[#B4B4BF]">

                    </span>
                    <span className="font-mono tabular-nums text-[#B4B4BF] text-[11px]">
                      Peak:{' '}
                      <strong className={selectedAirport.isOverloaded ? 'text-[#FCA5A5]' : 'text-[#F2D6B3]'}>
                        {selectedAirport.peakMovements}
                      </strong>{' '}
                      / {selectedAirport.capacity_per_hour}/hr
                    </span>
                  </div>
                  <div className="grid grid-cols-19 gap-0.5 items-end h-24 bg-[#0B0B0E] p-2 border border-[#2A2A34]">

                      const count = selectedAirport.hourly[h] || 0;
                      const cap = selectedAirport.capacity_per_hour;
                      const pct = Math.min(100, (count / Math.max(cap, 8)) * 100);
                      const over = count > cap;
                      const inClosure =
                        selectedAirport.closure &&
                        h * 60 >= selectedAirport.closure.start &&
                        h * 60 < selectedAirport.closure.end;
                      return (
                        <div
                          key={h}
                          className="flex flex-col items-center h-full justify-end"

                        >
                          <div
                            className={`w-full transition-all ${
                              inClosure
                                ? 'bg-[#E14949]/50'

                                ? 'bg-[#E14949]'

                            {f.origin}→{f.destination}

                        <div className="flex items-center gap-2">
                          <span className="text-[#F5F5F7]">
                            {f.status === 'cancelled' ? 'CXL' : toHHMM(f.actualDep)}
                          </span>
                          {f.delay > 0 && f.status !== 'cancelled' && (
                            <span className="text-[#F2D6B3] text-[10px] font-bold">+{f.delay}m</span>
                          )}
